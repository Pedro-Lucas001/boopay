name: Verificações de PR
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run check
        env:
          DATABASE_URL: file:./test.db
      - run: npm run package:plugin
      - uses: actions/upload-artifact@v4
        with:
          name: boopay-plugin-0.1.0
          path: dist/boopay-0.1.0.*
          retention-days: 14
  wordpress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: boopay-ci-disposable
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pboopay-ci-disposable"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BOOPAY_QA_ROOT: ${{ github.workspace }}/.test-artifacts/wordpress-qa
      BOOPAY_QA_DB: ${{ matrix.database }}
      BOOPAY_QA_MYSQL_HOST: 127.0.0.1:3306
      BOOPAY_QA_MYSQL_USER: root
      BOOPAY_QA_MYSQL_PASSWORD: boopay-ci-disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, mbstring, mysqli, pdo_sqlite, sqlite3, zip, fileinfo
          coverage: none
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run db:generate
      - shell: pwsh
        run: ./scripts/setup-wordpress-qa.ps1
      - run: npm run package:plugin
      - run: npm run qa:wordpress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordpress-qa-${{ matrix.database }}
          path: docs/evidencias/WORDPRESS/results.json
          retention-days: 14
